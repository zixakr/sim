<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>sim4u – Virtual numbers for SMS verification</title>
<meta name="description" content="Free shared numbers from 50+ countries, or a personal number with the OTP guaranteed within 5 minutes.">
<meta name="theme-color" content="#F2F3F5">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Cpath d='M6 2h8l6 6v12a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2z' fill='%232B59FF'/%3E%3Crect x='8' y='11' width='8' height='7' rx='1.5' fill='white'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@500;600&display=swap" rel="stylesheet">
<script>
  // Theme + splash flag before first paint
  (function () {
    var d = document.documentElement, t = null;
    try { t = localStorage.getItem('sim4u-theme'); } catch (e) {}
    if (!t) t = window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
    d.dataset.theme = t;
    var m = document.querySelector('meta[name=theme-color]');
    if (m) m.content = t === 'dark' ? '#12151A' : '#F2F3F5';
    try { if (sessionStorage.getItem('sim4u-splash')) d.classList.add('no-splash'); } catch (e) {}
  })();
</script>
<style>
  :root {
    --bg: #F2F3F5;
    --surface: #FFFFFF;
    --raised: #F4F5F7;
    --ink: #101216;
    --muted: #667085;
    --faint: #98A2B3;
    --line: rgba(16, 18, 22, .09);
    --accent: #2B59FF;
    --accent-ink: #FFFFFF;
    --accent-soft: rgba(43, 89, 255, .10);
    --mark: rgba(43, 89, 255, .14);
    --live: #16A34A;
    --hero-bg: #151922;
    --hero-ink: #F5F6F8;
    --mono: 'Geist Mono', ui-monospace, 'SF Mono', Menlo, Consolas, monospace;
  }
  [data-theme="dark"] {
    --bg: #12151A;
    --surface: #181C22;
    --raised: #1F242C;
    --ink: #EDEFF3;
    --muted: #9099A8;
    --faint: #6B7482;
    --line: rgba(255, 255, 255, .08);
    --accent: #7C97FF;
    --accent-ink: #12151A;
    --accent-soft: rgba(124, 151, 255, .14);
    --mark: rgba(124, 151, 255, .24);
    --live: #3DD68C;
    --hero-bg: #232B3A;
    --hero-ink: #F2F4F8;
  }

  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html { scroll-behavior: auto; }
  body {
    margin: 0; min-height: 100dvh;
    background: var(--bg); color: var(--ink);
    font: 400 15px/1.45 'Geist', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
    -webkit-font-smoothing: antialiased;
    transition: background-color .25s ease, color .25s ease;
  }
  a { color: inherit; }
  button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; text-align: inherit; }
  input { font: inherit; color: inherit; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  ::selection { background: var(--accent); color: var(--accent-ink); }

  .wrap { max-width: 1080px; margin: 0 auto; padding: 0 16px; }
  .narrow { max-width: 820px; }
  .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

  /* ---------- Splash ---------- */
  #splash {
    position: fixed; inset: 0; z-index: 200; display: grid; place-items: center;
    background: var(--bg); cursor: pointer;
    transition: opacity .5s ease, visibility .5s;
  }
  #splash.out { opacity: 0; visibility: hidden; }
  .no-splash #splash { display: none; }
  .splash-in { display: grid; justify-items: center; gap: 14px; text-align: center; padding: 24px; }
  .splash-sim { color: var(--accent); animation: insert 1.1s cubic-bezier(.2, .8, .2, 1) both; }
  @keyframes insert { from { transform: translateY(-70px); opacity: 0; } 55% { opacity: 1; } to { transform: none; } }
  .splash-slot { width: 132px; height: 4px; border-radius: 4px; background: var(--ink); opacity: .9; margin-top: -6px; animation: slot .5s .5s both; transform-origin: center; }
  @keyframes slot { from { transform: scaleX(0); opacity: 0; } }
  .splash-word { font-size: 36px; font-weight: 650; letter-spacing: -.045em; opacity: 0; animation: rise .6s .75s cubic-bezier(.2, .8, .2, 1) forwards; }
  .splash-sub { color: var(--muted); font-size: 14.5px; opacity: 0; animation: rise .6s 1s cubic-bezier(.2, .8, .2, 1) forwards; }
  @keyframes rise { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
  .splash-bar { position: absolute; left: 0; right: 0; bottom: 0; height: 3px; background: var(--line); }
  .splash-bar i { display: block; height: 100%; width: 100%; background: var(--accent); transform-origin: left; animation: load 2.1s cubic-bezier(.4, 0, .2, 1) forwards; }
  @keyframes load { from { transform: scaleX(0); } to { transform: scaleX(1); } }

  /* ---------- Top bar ---------- */
  .top {
    position: sticky; top: 0; z-index: 20;
    background: color-mix(in srgb, var(--bg) 88%, transparent);
    -webkit-backdrop-filter: blur(14px); backdrop-filter: blur(14px);
    border-bottom: 1px solid var(--line);
    padding-top: env(safe-area-inset-top);
  }
  .top-in { max-width: 1080px; margin: 0 auto; height: 60px; padding: 0 12px 0 16px; display: flex; align-items: center; justify-content: space-between; gap: 12px; }
  .brand { display: flex; align-items: center; gap: 9px; font-size: 22px; font-weight: 650; letter-spacing: -.035em; text-decoration: none; }
  .brand svg { color: var(--accent); }
  .right { display: flex; align-items: center; gap: 4px; }
  .nav { display: flex; gap: 2px; margin-right: 6px; }
  .nav a { padding: 8px 14px; border-radius: 10px; color: var(--muted); text-decoration: none; font-weight: 550; font-size: 14.5px; }
  .nav a:hover { color: var(--ink); background: var(--raised); }
  .nav a[aria-current="page"] { color: var(--ink); background: var(--raised); }
  @media (max-width: 640px) { .nav { display: none; } }
  .icon-btn { width: 40px; height: 40px; display: grid; place-items: center; border-radius: 12px; color: var(--muted); flex: none; transition: background-color .15s, color .15s; }
  .icon-btn:hover { background: var(--raised); color: var(--ink); }
  .icon-btn.small { width: 36px; height: 36px; border-radius: 10px; }
  .icon-btn[aria-pressed="true"] { color: var(--accent); background: var(--accent-soft); }

  /* ---------- Shared bits ---------- */
  .btn {
    display: inline-flex; align-items: center; justify-content: center; gap: 8px;
    height: 48px; padding: 0 20px; border-radius: 14px;
    font-weight: 600; font-size: 15.5px; text-decoration: none; white-space: nowrap;
    transition: transform .12s, background-color .15s;
  }
  .btn:active { transform: scale(.97); }
  .btn.primary { background: var(--accent); color: var(--accent-ink); }
  .btn.ghost { border: 1px solid var(--line); background: var(--surface); }
  .btn.sm { height: 38px; padding: 0 14px; border-radius: 11px; font-size: 14px; }
  .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--live); flex: none; }
  .dot.pulse { animation: pulse 2s ease-out infinite; }
  @keyframes pulse { 0% { box-shadow: 0 0 0 0 color-mix(in srgb, var(--live) 55%, transparent); } 70%, 100% { box-shadow: 0 0 0 7px transparent; } }
  .flag { width: 36px; height: 36px; border-radius: 50%; object-fit: cover; flex: none; background: var(--raised); box-shadow: 0 0 0 1px var(--line); }
  .flag.emoji { display: grid; place-items: center; font-size: 20px; line-height: 1; box-shadow: none; }
  .crumb { display: inline-flex; align-items: center; gap: 4px; margin-left: -4px; padding: 6px 8px 6px 2px; color: var(--muted); text-decoration: none; font-weight: 550; font-size: 14px; }
  .crumb:hover { color: var(--ink); }
  .page-head { padding: 22px 0 6px; }
  .page-head h1 { margin: 6px 0 8px; font-size: clamp(28px, 5vw, 42px); line-height: 1.08; letter-spacing: -.04em; font-weight: 650; }
  .page-head p { margin: 0; color: var(--muted); max-width: 62ch; font-size: 15.5px; line-height: 1.55; }
  .page-head p a { color: var(--accent); font-weight: 600; text-decoration: none; }
  .sub { display: flex; min-width: 0; font-size: 13px; color: var(--muted); }
  .sub span { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .sub span + span { margin-left: 8px; padding-left: 8px; border-left: 1px solid var(--line); }

  /* ---------- Home ---------- */
  .hero { padding: 40px 0 8px; }
  .hero h1 { margin: 0 0 14px; font-size: clamp(34px, 6.4vw, 60px); line-height: 1.04; letter-spacing: -.045em; font-weight: 650; max-width: 17ch; }
  .hero p { margin: 0; color: var(--muted); font-size: 17px; line-height: 1.5; max-width: 48ch; }
  .choices { display: grid; gap: 16px; grid-template-columns: 1fr; margin: 30px 0 10px; }
  @media (min-width: 820px) { .choices { grid-template-columns: 1fr 1fr; } }
  .choice { display: flex; flex-direction: column; gap: 14px; min-height: 360px; padding: 26px; border-radius: 26px; text-decoration: none; transition: transform .2s cubic-bezier(.2, .8, .2, 1); }
  .choice:hover { transform: translateY(-3px); }
  .choice.free { background: var(--surface); border: 1px solid var(--line); }
  .choice.paid { background: var(--hero-bg); color: var(--hero-ink); }
  .choice h2 { margin: 0; font-size: 28px; letter-spacing: -.035em; font-weight: 650; }
  .choice p { margin: 0; font-size: 15.5px; line-height: 1.55; max-width: 42ch; }
  .choice.free p { color: var(--muted); }
  .choice.paid p { color: color-mix(in srgb, var(--hero-ink) 72%, transparent); }
  .choice .spacer { flex: 1; }
  .flags { display: flex; }
  .flags .flag { width: 38px; height: 38px; margin-left: -9px; border: 2px solid var(--surface); box-shadow: none; }
  .flags .flag:first-child { margin-left: 0; }
  .choice.paid .flags .flag { border-color: var(--hero-bg); }
  .timer-big { font: 600 clamp(72px, 13vw, 108px)/.95 var(--mono); letter-spacing: -.05em; }
  .timer-cap { font-size: 14px; color: color-mix(in srgb, var(--hero-ink) 65%, transparent); margin-top: 6px; }

  .cmp-wrap { margin: 34px 0 20px; overflow-x: auto; }
  .cmp { width: 100%; min-width: 520px; border-collapse: collapse; font-size: 15px; }
  .cmp th, .cmp td { text-align: left; padding: 14px 12px 14px 0; border-bottom: 1px solid var(--line); vertical-align: top; }
  .cmp thead th { font-size: 17px; font-weight: 650; letter-spacing: -.02em; padding-top: 6px; }
  .cmp tbody th { font-weight: 550; color: var(--muted); width: 22%; }
  .cmp td { width: 39%; }

  /* ---------- Free list ---------- */
  .row-tools { display: grid; gap: 8px; margin: 18px 0 4px; grid-template-columns: 1fr; }
  @media (min-width: 700px) { .row-tools { grid-template-columns: 1fr 290px; } }
  .field { display: flex; align-items: center; gap: 10px; height: 48px; padding: 0 14px; background: var(--surface); border: 1px solid var(--line); border-radius: 13px; color: var(--muted); width: 100%; }
  .field:focus-within { border-color: var(--accent); }
  .field input { flex: 1; min-width: 0; border: 0; outline: 0; background: none; font-size: 16px; color: var(--ink); }
  .field input::placeholder { color: var(--faint); }
  .picker { justify-content: space-between; color: var(--ink); font-weight: 550; }
  .picker .l { display: flex; align-items: center; gap: 10px; min-width: 0; }
  .picker .l > span:last-child { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .picker .globe { color: var(--muted); display: grid; place-items: center; width: 24px; }
  .picker .flag { width: 24px; height: 24px; }
  .picker .chev { color: var(--muted); }
  .stat { display: flex; align-items: center; gap: 8px; padding: 12px 2px 8px; font-size: 13px; color: var(--muted); }
  .grid { display: grid; gap: 10px; grid-template-columns: repeat(auto-fill, minmax(310px, 1fr)); padding: 4px 0 48px; }
  .num {
    display: grid; grid-template-columns: 40px minmax(0, 1fr) auto; gap: 12px; align-items: center;
    padding: 12px 14px; border: 1px solid var(--line); background: var(--surface); border-radius: 16px;
    text-decoration: none; transition: border-color .15s, transform .12s;
  }
  .num:hover { border-color: color-mix(in srgb, var(--accent) 55%, var(--line)); }
  .num:active { transform: scale(.985); }
  .num .flag { width: 40px; height: 40px; }
  .num .n { font-size: 16px; font-weight: 600; letter-spacing: -.01em; font-variant-numeric: tabular-nums; white-space: nowrap; }
  .num .t { display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--faint); font-variant-numeric: tabular-nums; white-space: nowrap; }
  .num .t .dot { width: 6px; height: 6px; opacity: 0; }
  .num .t.fresh { color: var(--live); }
  .num .t.fresh .dot { opacity: 1; }
  .no-results { grid-column: 1 / -1; padding: 56px 28px; text-align: center; color: var(--muted); }
  .no-results strong { display: block; color: var(--ink); font-size: 16px; font-weight: 600; margin-bottom: 4px; }

  /* ---------- Number page ---------- */
  .np-head { display: flex; align-items: center; gap: 14px; margin: 10px 0 4px; }
  .np-head .flag { width: 52px; height: 52px; }
  .np-num { font-size: clamp(24px, 6vw, 36px); font-weight: 650; letter-spacing: -.035em; font-variant-numeric: tabular-nums; line-height: 1.1; overflow-wrap: anywhere; }
  .np-sub { color: var(--muted); font-size: 14px; margin-top: 3px; }
  .np-bar { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin: 16px 0 0; }
  .live { display: inline-flex; align-items: center; gap: 8px; height: 38px; padding: 0 14px; border-radius: 11px; background: var(--surface); border: 1px solid var(--line); font-size: 14px; font-weight: 600; }
  .live.paused .dot { background: var(--faint); animation: none; }
  .notice { margin: 16px 0 0; padding: 12px 14px; border-radius: 12px; background: var(--raised); font-size: 14px; line-height: 1.5; color: var(--muted); }
  .notice a { color: var(--accent); font-weight: 600; text-decoration: none; }
  .chips { display: flex; gap: 8px; overflow-x: auto; padding: 16px 0 12px; scrollbar-width: none; }
  .chips::-webkit-scrollbar { display: none; }
  .chip { flex: none; height: 34px; padding: 0 14px; border-radius: 999px; border: 1px solid var(--line); background: var(--surface); font-size: 13.5px; font-weight: 550; color: var(--muted); transition: background-color .15s, color .15s; }
  .chip:hover { color: var(--ink); }
  .chip[aria-pressed="true"] { background: var(--ink); border-color: var(--ink); color: var(--bg); }

  .feed { border-top: 1px solid var(--line); overflow-anchor: none; padding-bottom: 56px; }
  .msg { display: grid; grid-template-columns: 40px minmax(0, 1fr) auto; column-gap: 12px; row-gap: 10px; align-items: center; padding: 16px 2px; border-bottom: 1px solid var(--line); }
  .msg.is-new { animation: arrive .5s cubic-bezier(.2, .8, .2, 1), flash 2.4s ease-out; }
  @keyframes arrive { from { opacity: 0; transform: translateY(-10px); } }
  @keyframes flash { from { background: var(--accent-soft); } to { background: transparent; } }
  .tile { width: 40px; height: 40px; border-radius: 11px; display: grid; place-items: center; background: var(--tb); color: var(--tf); font-weight: 700; font-size: 16px; }
  .msg .svc { font-weight: 600; font-size: 15px; }
  .msg .from { display: flex; flex-wrap: wrap; gap: 0 10px; font-size: 12.5px; color: var(--muted); font-variant-numeric: tabular-nums; }
  .code {
    display: inline-grid; place-items: center; min-width: 104px; height: 44px; padding: 0 14px;
    border-radius: 12px; background: var(--accent-soft); color: var(--accent);
    font: 600 22px/1 var(--mono); letter-spacing: .03em;
    transition: background-color .15s, color .15s, transform .12s;
  }
  .code:active { transform: scale(.96); }
  .code > span { grid-area: 1 / 1; }
  .code .done { visibility: hidden; display: inline-flex; align-items: center; gap: 6px; font: 600 14px 'Geist', system-ui, sans-serif; letter-spacing: 0; }
  .code.copied { background: var(--accent); color: var(--accent-ink); }
  .code.copied .c { visibility: hidden; }
  .code.copied .done { visibility: visible; }
  .bubble { grid-column: 2 / -1; margin: 0; padding: 11px 14px; background: var(--surface); border: 1px solid var(--line); border-radius: 16px 16px 16px 5px; font-size: 14.5px; line-height: 1.5; white-space: pre-line; overflow-wrap: anywhere; user-select: text; }
  .bubble mark { background: var(--mark); color: inherit; border-radius: 4px; padding: 0 3px; font-weight: 600; }
  @media (max-width: 380px) { .code { min-width: 92px; font-size: 20px; } }
  .empty { display: grid; justify-items: center; gap: 10px; padding: 72px 24px; text-align: center; color: var(--muted); }
  .empty strong { color: var(--ink); font-size: 16px; font-weight: 600; }
  .empty svg { color: var(--faint); }

  /* ---------- Personal numbers ---------- */
  .pc { display: grid; grid-template-columns: 52px minmax(0, 1fr) auto; gap: 14px; align-items: center; padding: 18px 0; border-bottom: 1px solid var(--line); }
  .pc .flag { width: 52px; height: 52px; }
  .pc .name { font-size: 19px; font-weight: 650; letter-spacing: -.02em; }
  .pc .sub { margin-top: 3px; font-size: 14px; }
  @media (max-width: 560px) { .pc { grid-template-columns: 52px 1fr; } .pc .btn { grid-column: 1 / -1; } }
  .plist { border-top: 1px solid var(--line); margin-top: 22px; }
  .block { margin: 36px 0 0; }
  .block h2 { margin: 0 0 12px; font-size: 22px; letter-spacing: -.03em; font-weight: 650; }
  .steps { margin: 0; padding: 0; list-style: none; counter-reset: s; display: grid; gap: 14px; }
  .steps li { counter-increment: s; display: grid; grid-template-columns: 32px 1fr; gap: 12px; align-items: start; line-height: 1.5; }
  .steps li::before { content: counter(s); width: 32px; height: 32px; border-radius: 50%; display: grid; place-items: center; background: var(--accent-soft); color: var(--accent); font-weight: 650; font-size: 14px; }
  .support { margin: 36px 0 56px; padding: 22px; border-radius: 22px; background: var(--hero-bg); color: var(--hero-ink); display: grid; gap: 14px; }
  .support h2 { margin: 0; font-size: 22px; letter-spacing: -.03em; font-weight: 650; }
  .support p { margin: 0; line-height: 1.55; color: color-mix(in srgb, var(--hero-ink) 74%, transparent); max-width: 52ch; }
  .support .acts { display: flex; flex-wrap: wrap; gap: 10px; }
  .support .btn.ghost { background: transparent; border-color: color-mix(in srgb, var(--hero-ink) 28%, transparent); color: var(--hero-ink); }

  .lookup { display: flex; gap: 8px; margin: 22px 0 0; flex-wrap: wrap; }
  .lookup .field { flex: 1; min-width: 220px; }
  .otp-top { margin: 14px 0 0; padding: 22px; border-radius: 22px; background: var(--hero-bg); color: var(--hero-ink); display: grid; gap: 10px; }
  .otp-top .lbl { font-size: 14px; color: color-mix(in srgb, var(--hero-ink) 65%, transparent); }
  .otp-top .big { font-size: clamp(24px, 6vw, 34px); font-weight: 650; letter-spacing: -.035em; font-variant-numeric: tabular-nums; }
  .otp-top .clock { font: 600 clamp(44px, 10vw, 64px)/1 var(--mono); letter-spacing: -.04em; }
  .bar { height: 4px; border-radius: 4px; background: color-mix(in srgb, var(--hero-ink) 18%, transparent); overflow: hidden; }
  .bar i { display: block; height: 100%; background: var(--accent); width: 100%; transform-origin: left; transition: transform 1s linear; }

  /* ---------- Footer ---------- */
  .foot { border-top: 1px solid var(--line); margin-top: 28px; padding: 22px 0 calc(28px + env(safe-area-inset-bottom)); color: var(--faint); font-size: 13px; }
  .foot .wrap { display: flex; flex-wrap: wrap; gap: 8px 24px; justify-content: space-between; }
  .foot a { color: var(--muted); font-weight: 550; text-decoration: none; }
  .foot a:hover { color: var(--ink); }

  /* ---------- Country dialog ---------- */
  dialog { border: 0; padding: 0; background: var(--surface); color: var(--ink); width: min(440px, calc(100vw - 32px)); max-height: min(640px, 82dvh); border-radius: 20px; box-shadow: 0 24px 80px rgba(0, 0, 0, .3); overflow: hidden; }
  dialog[open] { display: flex; flex-direction: column; animation: pop .22s cubic-bezier(.2, .8, .2, 1); }
  dialog::backdrop { background: rgba(10, 12, 16, .5); -webkit-backdrop-filter: blur(3px); backdrop-filter: blur(3px); }
  @keyframes pop { from { opacity: 0; transform: translateY(8px) scale(.98); } }
  @keyframes sheet { from { transform: translateY(40%); opacity: .4; } }
  @media (max-width: 879px) {
    dialog { width: 100%; max-width: 100%; margin: auto 0 0; border-radius: 22px 22px 0 0; max-height: 86dvh; }
    dialog[open] { animation: sheet .3s cubic-bezier(.2, .8, .2, 1); }
  }
  .dlg-head { display: flex; align-items: center; justify-content: space-between; padding: 14px 10px 6px 20px; }
  .dlg-head h2 { margin: 0; font-size: 18px; font-weight: 650; letter-spacing: -.02em; }
  .dlg-search { padding: 6px 16px 10px; }
  .dlg-search .field { background: var(--raised); border-color: transparent; }
  .clist { flex: 1; overflow-y: auto; padding: 0 8px calc(12px + env(safe-area-inset-bottom)); overscroll-behavior: contain; }
  .crow { display: grid; grid-template-columns: 32px minmax(0, 1fr) auto; gap: 12px; align-items: center; width: 100%; padding: 9px 12px; border-radius: 12px; }
  .crow:hover { background: var(--raised); }
  .crow.is-active { background: var(--accent-soft); }
  .crow .flag { width: 32px; height: 32px; }
  .crow .name { font-weight: 550; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

    return { id: ++mid, k, code, disp, from: s.from, body: s.body(code, disp, r), ts };
  }

      let phone, guard = 0;
      do { phone = fillTpl(pick(ct.tpl, r), r); } while (used.has(phone) && ++guard < 20);
      used.add(phone);
      const num = { id: NUMBERS.length + 1, cc: ct.cc, phone, digits: phone.replace(/\D/g, ''), carrier: pick(ct.carriers, r), msgs: [] };
      const hr = seeded('hist:' + phone);
      const count = 6 + Math.floor(hr() * 10);
      let t = Date.now() - (15e3 + hr() * 18 * 60e3);
      for (let j = 0; j < count; j++) { num.msgs.push(makeMsg(num, hr, t)); t -= (2 + hr() * hr() * 80) * 60e3; }

      o.type = 'sine'; o.frequency.setValueAtTime(820, t); o.frequency.exponentialRampToValueAtTime(1180, t + .09);
      g.gain.setValueAtTime(.12, t); g.gain.exponentialRampToValueAtTime(.001, t + .22);

  }
  function route() {
    if (cleanup) { cleanup(); cleanup = null; }
    clearTimeout(timer);
    const parts = location.hash.replace(/^#\/?/, '').split('?')[0].split('/').filter(Boolean);
    const sec = parts[0] || '';
    document.querySelectorAll('[data-nav]').forEach(a => {
      if (a.dataset.nav === sec) a.setAttribute('aria-current', 'page'); else a.removeAttribute('aria-current');
    });
    footer(sec);
    window.scrollTo(0, 0);
    if (sec === 'free') return parts[1] ? viewNumber(+parts[1]) : viewFree();
    if (sec === 'paid') {
      if (parts[1] === 'otp') return parts[2] ? viewPaidOtp(decodeURIComponent(parts[2])) : viewPaidLookup();
      return viewPaid();
    }
    viewHome();
  }
  window.addEventListener('hashchange', route);
  setInterval(() => {
    document.querySelectorAll('[data-ts]').forEach(el => { el.textContent = ago(+el.dataset.ts); });
  }, 10000);

  /* =====================================================
     THEME + SPLASH + INIT
     ===================================================== */
  function paintTheme() {
    const dark = document.documentElement.dataset.theme === 'dark';
    $('#themeBtn').innerHTML = icon(dark ? 'sun' : 'moon', 20);
    $('#themeBtn').setAttribute('aria-label', dark ? 'Switch to light theme' : 'Switch to dark theme');
    const m = $('meta[name=theme-color]'); if (m) m.content = dark ? '#12151A' : '#F2F3F5';
  }
  $('#themeBtn').addEventListener('click', () => {
    const next = document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark';
    document.documentElement.dataset.theme = next;
    try { localStorage.setItem('sim4u-theme', next); } catch (e) { /* private mode */ }
    paintTheme();
  });
  paintTheme();

  const splash = $('#splash');
  function endSplash() {
    if (splash.classList.contains('out')) return;
    splash.classList.add('out');
    try { sessionStorage.setItem('sim4u-splash', '1'); } catch (e) { /* ignore */ }
    setTimeout(() => splash.remove(), 600);
  }
  if (document.documentElement.classList.contains('no-splash')) splash.remove();
  else {
    const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;
    setTimeout(endSplash, reduced ? 700 : 2300);
    splash.addEventListener('click', endSplash);
  }

  route();
})();
</script>
</body>
</html>
